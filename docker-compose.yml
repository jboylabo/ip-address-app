services:
  loopback:
    build: .
    container_name: bind-loopback
    environment:
      HOST: 127.0.0.1
      PORT: "3000"
    ports:
      - "3001:3000"

  allifaces:
    build: .
    container_name: bind-all
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "3002:3000"
